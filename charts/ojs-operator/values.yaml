# OJS Operator Helm Values

# Operator image configuration
image:
  repository: ghcr.io/openjobspec/ojs-k8s-operator
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Operator deployment settings
replicaCount: 1

# Leader election (recommended for HA)
leaderElection:
  enabled: true

# Resource requirements for the operator pod
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Security context for the operator pod
podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC
rbac:
  create: true

# CRD installation
crds:
  install: true

# Health probes
healthProbe:
  port: 8081

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# ServiceMonitor RBAC (optional, for prometheus-operator integration)
serviceMonitor:
  rbac:
    enabled: true

# Webhooks
# ⚠️  NOTE: Webhooks are DISABLED by default. When disabled, OJSCluster and OJSWorker
# custom resources are NOT validated on admission — invalid specs may reach the cluster.
#
# Webhook validation for OJSCluster and OJSWorker CRDs.
# Enabled by default to catch invalid resources early.
# Requires cert-manager (https://cert-manager.io) for automatic TLS certificate management.
# To disable (e.g., in dev clusters without cert-manager): set webhook.enabled=false
webhook:
  enabled: true
  failurePolicy: Fail
  certManager:
    enabled: true
    issuerRef:
      kind: Issuer
      name: ""  # Auto-populated with self-signed issuer if empty

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}

# Additional labels for all resources
commonLabels: {}

# Additional annotations for the operator deployment
podAnnotations: {}

