# OJS Operator Helm Values

# Operator image configuration
image:
  repository: ghcr.io/openjobspec/ojs-k8s-operator
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Operator deployment settings
replicaCount: 1

# Leader election (recommended for HA). When enabled, the chart also grants
# coordination.k8s.io Lease permissions to the manager ServiceAccount.
leaderElection:
  enabled: true

# Resource requirements for the operator pod
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Security context for the operator pod
podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC
rbac:
  create: true

# CRD installation
crds:
  install: true

# Health probes
healthProbe:
  port: 8081

# Pod Disruption Budget for the operator Deployment.
# The ClusterRole always includes policy/v1 PodDisruptionBudget permissions
# because the controller also manages PDBs for OJSCluster server Deployments.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# ServiceMonitor RBAC (optional, for prometheus-operator integration)
serviceMonitor:
  rbac:
    enabled: true

# Webhooks
# Webhook validation for OJSCluster and OJSWorker CRDs.
# Enabled by default to catch invalid resources early.
# Requires cert-manager (https://cert-manager.io) for automatic TLS certificate management.
# To disable (e.g., in dev clusters without cert-manager): set webhook.enabled=false.
# ⚠️  NOTE: when disabled, OJSCluster and OJSWorker custom resources are NOT
# validated on admission — invalid specs may reach the cluster.
# When enabled, the Deployment mounts <release-fullname>-webhook-server-cert
# at controller-runtime's serving certificate directory. If certManager.enabled
# is false, provision that TLS Secret and webhook CA-bundle injection by
# another mechanism before starting.
webhook:
  enabled: true
  failurePolicy: Fail
  certManager:
    enabled: true
    issuerRef:
      kind: Issuer
      # Leave empty to render and use <release-fullname>-selfsigned-issuer.
      # Set a name (and kind, if needed) to use an existing custom issuer.
      name: ""

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}

# Additional labels for all resources
commonLabels: {}

# Additional annotations for the operator deployment
podAnnotations: {}
