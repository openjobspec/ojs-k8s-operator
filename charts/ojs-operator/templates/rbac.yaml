{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ojs-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ojs-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ojs-operator.fullname" . }}-manager-role
  labels:
    {{- include "ojs-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ojs.openjobspec.dev
    resources:
      - ojsclusters
      - ojsworkers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ojs.openjobspec.dev
    resources:
      - ojsclusters/status
      - ojsworkers/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ojs.openjobspec.dev
    resources:
      - ojsclusters/finalizers
      - ojsworkers/finalizers
    verbs:
      - update
  - apiGroups:
      - ojs.openjobspec.dev
    resources:
      - ojsworkers/scale
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  {{- if .Values.serviceMonitor.rbac.enabled }}
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ojs-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "ojs-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ojs-operator.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "ojs-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
