version: "2"

run:
  timeout: 10m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - gocritic
    - gocyclo
    - unparam
    - bodyclose
    - noctx
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G104 # duplicate of errcheck
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - diagnostic
        - performance
    gocyclo:
      min-complexity: 15
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
          - gocyclo
          - noctx
          - unparam
