name: Release Readiness

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4
      - name: Validate release tag and metadata
        if: github.ref_type == 'tag'
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(sed -n 's/^VERSION ?= //p' Makefile)"
          test -n "${PACKAGE_VERSION}"
          test "${VERSION}" = "${PACKAGE_VERSION}"
          grep -Fq "## [${VERSION}]" CHANGELOG.md
          test "$(sed -n 's/^version: //p' charts/ojs-operator/Chart.yaml)" = "${VERSION}"
          test "$(sed -n 's/^appVersion: \"\\(.*\\)\"/\\1/p' charts/ojs-operator/Chart.yaml)" = "${VERSION}"
          grep -Fq "image: ghcr.io/openjobspec/ojs-k8s-operator:v${VERSION}" config/manager/deployment.yaml
          grep -Fq "defaultImage = \"ghcr.io/openjobspec/ojs-server:v${VERSION}\"" internal/controller/ojscluster_desired.go
          grep -Fq "default: ghcr.io/openjobspec/ojs-server:v${VERSION}" config/crd/ojscluster-crd.yaml
          grep -Fq "default: ghcr.io/openjobspec/ojs-server:v${VERSION}" charts/ojs-operator/templates/crds/ojscluster-crd.yaml
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - run: go build ./...
      - run: helm lint charts/ojs-operator
      - run: helm template test charts/ojs-operator --values charts/ojs-operator/values.yaml
      - run: docker build --build-arg VERSION="$(sed -n 's/^VERSION ?= //p' Makefile)" .
